# Comma-separated paths to directories with sources
# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=webapp

# Exclude test subdirectories from source scope
sonar.exclusions=webapp/test/**

# Encoding of the source code. Python should always be UTF-8.
sonar.sourceEncoding=UTF-8

# Comma-separated paths to directories containing the compiled bytecode files corresponding to your source files.
# sonar.java.binaries=**/target/classes

# Handling Java source version
# sonar.java.source=17

# Control the quantity/level of logs produced during an analysis
# sonar.log.level=DEBUG

# adds more detail to both client and server-side analysis logs
# sonar.verbose=true
